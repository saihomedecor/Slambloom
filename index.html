<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SlamBloom</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  transition: 0.3s;
}

/* THEMES */
.dark {
  background: #000;
  color: #fff;
}

.pink {
  background: linear-gradient(135deg,#ff2e88,#7b2ff7);
  color: white;
}

.light {
  background: #f4f4f4;
  color: #000;
}

.container {
  padding: 20px;
  text-align: center;
}

input, select {
  width: 90%;
  padding: 12px;
  margin: 10px 0;
  border-radius: 10px;
  border: none;
  font-size: 16px;
}

button {
  padding: 12px 20px;
  border: none;
  border-radius: 10px;
  font-weight: bold;
  cursor: pointer;
  margin: 10px;
}

.submit-btn {
  background: #ff2e88;
  color: white;
}

/* RESULT CARD */
.result-card {
  display: none;
  padding: 25px;
  border-radius: 25px;
  width: 85%;
  margin: 30px auto;
  background: linear-gradient(135deg,#ff2e88,#7b2ff7);
  color: white;
}

.result-card h2 {
  margin-bottom: 20px;
}

.card-buttons {
  display: flex;
  justify-content: space-between;
  margin-top: 20px;
}

.back-btn {
  background: #333;
  color: white;
}

.download-btn {
  background: white;
  color: #ff2e88;
}
</style>
</head>

<body class="dark">

<!-- MAIN PAGE -->
<div class="container" id="mainPage">
  <h1>🌸 SlamBloom – Expose Your Friend 😈</h1>

  <select onchange="changeTheme(this.value)">
    <option value="dark">Dark Theme</option>
    <option value="pink">Pink Theme</option>
    <option value="light">Light Theme</option>
  </select>

  <input type="text" id="name" placeholder="This slam is for...">
  <input type="text" id="real" placeholder="In real life they are...">
  <input type="text" id="dangerous" placeholder="Dangerous 😈">
  <input type="text" id="red" placeholder="Biggest Red Flag 🚩">
  <input type="text" id="secret" placeholder="Secret nobody knows 🤫">
  <input type="text" id="embarrass" placeholder="Embarrassing moment 😂">
  <input type="text" id="crush" placeholder="Crush they hide 👀">
  <input type="text" id="toxic" placeholder="Toxic trait ☠">
  <input type="text" id="green" placeholder="Green flag 🌿">
  <input type="text" id="talent" placeholder="Hidden talent 🎭">
  <input type="text" id="dramatic" placeholder="Most dramatic scene 🎬">
  <input type="text" id="fake" placeholder="Fake personality 🤔">

  <button class="submit-btn" onclick="generateCard()">Generate Slam</button>
</div>

<!-- RESULT CARD -->
<div class="result-card" id="resultCard">
  <h2 id="cardTitle"></h2>
  <p id="cardContent"></p>

  <div class="card-buttons">
    <button class="back-btn" onclick="goBack()">⬅ Back</button>
    <button class="download-btn" onclick="downloadCard()">⬇ Download</button>
  </div>
</div>

<script>

function changeTheme(theme) {
  document.body.className = theme;
}

function generateCard() {

  let name = document.getElementById("name").value;
  let real = document.getElementById("real").value;
  let dangerous = document.getElementById("dangerous").value;
  let red = document.getElementById("red").value;
  let secret = document.getElementById("secret").value;
  let embarrass = document.getElementById("embarrass").value;
  let crush = document.getElementById("crush").value;
  let toxic = document.getElementById("toxic").value;
  let green = document.getElementById("green").value;
  let talent = document.getElementById("talent").value;
  let dramatic = document.getElementById("dramatic").value;
  let fake = document.getElementById("fake").value;

  document.getElementById("cardTitle").innerHTML = "Slam for " + name;

  document.getElementById("cardContent").innerHTML = `
  <b>In real life:</b> ${real} <br><br>
  <b>Dangerous:</b> ${dangerous} <br><br>
  <b>Biggest Red Flag:</b> ${red} <br><br>
  <b>Secret nobody knows:</b> ${secret} <br><br>
  <b>Embarrassing moment:</b> ${embarrass} <br><br>
  <b>Crush they hide:</b> ${crush} <br><br>
  <b>Toxic trait:</b> ${toxic} <br><br>
  <b>Green flag:</b> ${green} <br><br>
  <b>Hidden talent:</b> ${talent} <br><br>
  <b>Most dramatic scene:</b> ${dramatic} <br><br>
  <b>Fake personality:</b> ${fake}
  `;

  document.getElementById("mainPage").style.display = "none";
  document.getElementById("resultCard").style.display = "block";
}

function goBack() {
  document.getElementById("resultCard").style.display = "none";
  document.getElementById("mainPage").style.display = "block";
}

function downloadCard() {
  html2canvas(document.querySelector("#resultCard")).then(canvas => {
    const link = document.createElement("a");
    link.download = "slam.png";
    link.href = canvas.toDataURL();
    link.click();
  });
}

</script>

</body>
</html>
