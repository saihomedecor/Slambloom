<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SlamBloom</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:'Poppins',sans-serif;
background:#111;
color:white;
text-align:center;
}

.container{
max-width:500px;
margin:auto;
padding:20px;
}

input,textarea,select{
width:100%;
padding:12px;
margin:8px 0;
border-radius:12px;
border:none;
font-size:14px;
}

button{
padding:12px 20px;
border:none;
border-radius:25px;
background:#ff2e88;
color:white;
font-weight:600;
margin-top:15px;
cursor:pointer;
}

#resultModal{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:black;
justify-content:center;
align-items:center;
z-index:999;
}

.storyCard{
width:300px;
height:533px;
border-radius:25px;
padding:20px;
box-sizing:border-box;
overflow:hidden;
background:linear-gradient(180deg,#ff2e88,#7b2ff7);
animation:fade 0.5s ease;
}

@keyframes fade{
from{opacity:0;transform:scale(0.8)}
to{opacity:1;transform:scale(1)}
}

.answer{
font-size:12px;
text-align:left;
margin:6px 0;
}
</style>
</head>

<body>

<div class="container">
<h2>🌸 SlamBloom – Expose Your Friend 😈</h2>

<input id="friendName" placeholder="This slam is for...">

<select id="realType">
<option>In real life they are...</option>
<option>Innocent 😇</option>
<option>Dangerous 😈</option>
<option>Drama Queen 👑</option>
<option>Savage 🔥</option>
</select>

<div id="questions"></div>

<button onclick="generateCard()">🔥 Expose Now</button>
</div>

<div id="resultModal">
<div class="storyCard" id="storyCard">
<h3 id="cardTitle"></h3>
<div id="answers"></div>
<button onclick="downloadCard()">📥 Download</button>
<button onclick="closeModal()">Make Another 😈</button>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script>

const questionList = [
"Biggest Red Flag 🚩",
"Secret nobody knows 🤫",
"Embarrassing moment 😂",
"Crush they hide 👀",
"Toxic trait ☠️",
"Green flag 🌿",
"Hidden talent 🎭",
"Most dramatic scene 🎬",
"Fake personality 🤥",
"Biggest lie 😬",
"Late night habit 🌙",
"Worst fashion 👗",
"Best quality ❤️",
"Secret nickname 🫢",
"Final confession 💌"
];

const qContainer = document.getElementById("questions");

questionList.forEach((q,i)=>{
let area = document.createElement("textarea");
area.placeholder = q;
area.className = "q-input";
area.id = "q"+i;
qContainer.appendChild(area);
});

function generateCard(){

const name = document.getElementById("friendName").value || "Someone";
const type = document.getElementById("realType").value;

let answerHTML = `<div class="answer"><b>${type}</b></div>`;

questionList.forEach((q,i)=>{
let val = document.getElementById("q"+i).value;
if(val.trim() !== ""){
answerHTML += `<div class="answer"><b>${q}</b><br>${val}</div>`;
}
});

document.getElementById("cardTitle").innerText = "Slam for "+name;
document.getElementById("answers").innerHTML = answerHTML;

document.getElementById("resultModal").style.display = "flex";
}

function closeModal(){
document.getElementById("resultModal").style.display = "none";
location.reload();
}

function downloadCard(){
html2canvas(document.getElementById("storyCard")).then(canvas=>{
let link=document.createElement("a");
link.download="SlamBloom.png";
link.href=canvas.toDataURL();
link.click();
});
}

</script>

</body>
</html>
