<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SlamBloom</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:'Poppins',sans-serif;
background:#0f0f0f;
color:white;
text-align:center;
}

.container{
padding:20px;
max-width:500px;
margin:auto;
}

input,textarea,select{
width:100%;
padding:12px;
margin:8px 0;
border-radius:10px;
border:none;
font-size:14px;
}

button{
padding:12px 20px;
border:none;
border-radius:25px;
background:#ff2e88;
color:white;
font-weight:600;
margin:10px;
cursor:pointer;
}

.storyCard{
width:300px;
height:533px;
margin:20px auto;
border-radius:25px;
padding:20px;
box-sizing:border-box;
background:linear-gradient(180deg,#ff2e88,#7b2ff7);
display:none;
overflow:hidden;
animation:fadeIn 0.6s ease;
}

@keyframes fadeIn{
from{opacity:0;transform:scale(0.9)}
to{opacity:1;transform:scale(1)}
}

.answer{
font-size:12px;
text-align:left;
margin:6px 0;
}

.theme1{
background:linear-gradient(180deg,#ff2e88,#7b2ff7);
}

.theme2{
background:linear-gradient(180deg,#00c6ff,#0072ff);
}

.theme3{
background:linear-gradient(180deg,#f7971e,#ffd200);
color:black;
}
</style>
</head>

<body>

<div class="container">
<h2>🌸 SlamBloom – Expose Your Friend 😈</h2>

<input id="forWho" placeholder="This slam is for...">

<select id="realLife">
<option>In real life they are...</option>
<option>Innocent 😇</option>
<option>Dangerous 😈</option>
<option>Drama Queen 👑</option>
<option>Silent but savage 🔥</option>
</select>

<textarea id="q1" placeholder="Biggest Red Flag 🚩"></textarea>
<textarea id="q2" placeholder="Secret I know about them 🤫"></textarea>
<textarea id="q3" placeholder="Most embarrassing moment 😂"></textarea>
<textarea id="q4" placeholder="One thing I never told you 💔"></textarea>
<textarea id="q5" placeholder="Crush reveal 👀"></textarea>
<textarea id="q6" placeholder="Most toxic trait ☠️"></textarea>
<textarea id="q7" placeholder="Green flag 🌿"></textarea>
<textarea id="q8" placeholder="If they were a meme 🤡"></textarea>
<textarea id="q9" placeholder="Late night habit 🌙"></textarea>
<textarea id="q10" placeholder="Hidden talent 🎭"></textarea>
<textarea id="q11" placeholder="Worst fashion moment 👗"></textarea>
<textarea id="q12" placeholder="Best quality ❤️"></textarea>
<textarea id="q13" placeholder="Most dramatic scene 🎬"></textarea>
<textarea id="q14" placeholder="Nickname I secretly use 🫢"></textarea>
<textarea id="q15" placeholder="Final confession 💌"></textarea>

<select id="themeSelect">
<option value="theme1">Pink Drama</option>
<option value="theme2">Blue Savage</option>
<option value="theme3">Golden Roast</option>
</select>

<button onclick="generateCard()">🔥 Expose Now</button>
</div>

<div id="storyCard" class="storyCard">
<h3 id="cardTitle"></h3>
<div id="answers"></div>
<button onclick="downloadCard()">📥 Download</button>
<button onclick="location.reload()">Make Another 😈</button>
</div>

<audio id="bgMusic" loop>
<source src="https://www.soundjay.com/button/beep-07.wav">
</audio>

<script>

function generateCard(){

document.getElementById("bgMusic").play();

let card=document.getElementById("storyCard");
card.style.display="block";

let theme=document.getElementById("themeSelect").value;
card.className="storyCard "+theme;

document.getElementById("cardTitle").innerText=
"Slam for "+document.getElementById("forWho").value;

let answersDiv=document.getElementById("answers");
answersDiv.innerHTML="";

for(let i=1;i<=15;i++){
let val=document.getElementById("q"+i).value;
if(val.trim()!=""){
answersDiv.innerHTML+=
"<div class='answer'>• "+val+"</div>";
}
}

}

function downloadCard(){

html2canvas(document.getElementById("storyCard")).then(canvas=>{
let link=document.createElement("a");
link.download="slambloom.png";
link.href=canvas.toDataURL();
link.click();
});

}

</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

</body>
</html>
