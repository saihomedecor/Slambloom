<!DOCTYPE html>
<html>
<head>
  <title>SlamBloom | Expose Edition</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h1>🌸 SlamBloom</h1>
  <h2>Expose Your Friend 😈</h2>

  <form id="slamForm">
    
    <label>This slam is for:</label>
    <input type="text" required>

    <label>Their Instagram ID:</label>
    <input type="text">

    <label>In real life they are:</label>
    <select>
      <option>Main Character 🎬</option>
      <option>Drama Machine 🎭</option>
      <option>Certified Clown 🤡</option>
      <option>Secret Romantic 💕</option>
    </select>

    <label>Biggest Red Flag 🚩</label>
    <input type="text">

    <label>One thing I never told you 👀</label>
    <textarea rows="3"></textarea>

    <button type="submit">🔥 Expose Now</button>

  </form>

  <div id="result" class="hidden">
    <h3>🌸 Expose Completed!</h3>
    <p>Screenshot this & tag @SlamBloom 😈</p>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
